version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ongplus_db
    restart: always
    environment:
      POSTGRES_DB: ong_plus
      POSTGRES_USER: ongplus_user
      POSTGRES_PASSWORD: "@0N62Lu5#8@ck3N6"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ongplus_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=ong_plus
      - DB_USER=ongplus_user
      - DB_PASSWORD=@0N62Lu5#8@ck3N6
      - SECRET_KEY=django-insecure-docker-dev-key-12345
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ongplus_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
